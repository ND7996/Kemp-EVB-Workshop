[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "evbopenmm"
version = "0.0.0"
description = "EVBOpenMM Python package"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "numpy",
    "openmm>=8.2",
]

[project.scripts]
evbopenmm-workflow = "evbopenmm.workflow.cli:main"

[project.optional-dependencies]
optimize = [
    "scipy",
]
openff = [
    "openff-toolkit",
    "openmmforcefields",
    "rdkit",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# ship the OPLS-AA/M force-field XMLs behind the "opls-aam" preset
evbopenmm = ["data/opls_aam/*.xml"]
